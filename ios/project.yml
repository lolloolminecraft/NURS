name: Opora
options:
  bundleIdPrefix: com.opora
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Opora:
    type: application
    platform: iOS
    sources:
      - path: Opora/OporaApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opora.iphone
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_CFBundleDisplayName: 'Опора'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
