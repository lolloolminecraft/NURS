name: NursMode
options:
  bundleIdPrefix: com.nursmode
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NursMode:
    type: application
    platform: iOS
    sources:
      - path: NursMode/NursModeApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nursmode.iphone
        PRODUCT_NAME: NursMode
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NursMode/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Nurs-Mode"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
