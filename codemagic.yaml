workflows:
  nurs-mode-ios:
    name: Nurs-Mode IPA for Sideloadly
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Validate NM Live and iPhone configuration
        script: |
          python3 tests/test_nm_live.py
          plutil -lint ios/NursMode/Info.plist
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Generate iOS project
        script: |
          cd ios
          xcodegen generate
      - name: Build NM for physical iPhone
        script: |
          xcodebuild -project ios/NursMode.xcodeproj -scheme NursMode -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$CM_BUILD_DIR/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$CM_BUILD_DIR/ios-build/Build/Products/Release-iphoneos/NursMode.app" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/Nurs-Mode.ipa" Payload
      - name: Verify output IPA
        script: |
          test -s "$CM_BUILD_DIR/Nurs-Mode.ipa"
          unzip -t "$CM_BUILD_DIR/Nurs-Mode.ipa"
    artifacts:
      - Nurs-Mode.ipa
