name: NURS Release Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: nurs-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test monitoring
        run: python -m unittest discover -s tests
      - name: Check PS4 release and notify
        run: python monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ vars.WHATSAPP_TEMPLATE_LANG }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          NURS_SITE_URL: ${{ vars.NURS_SITE_URL }}
      - name: Commit status updates
        run: |
          git config user.name "NURS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          if ! git diff --cached --quiet; then
            git commit -m "NURS: refresh release status"
            git push
          fi

  publish:
    if: ${{ !github.event.repository.private }}
    needs: watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
