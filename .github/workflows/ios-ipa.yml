name: Opora iPhone IPA
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: cd ios && xcodegen generate
      - name: Build for iPhone
        run: xcodebuild -project ios/Opora.xcodeproj -scheme Opora -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/OporaBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/OporaBuild/Build/Products/Release-iphoneos/Opora.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Opora.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Opora-iPhone-Sideloadly
          path: Opora.ipa
          retention-days: 90
